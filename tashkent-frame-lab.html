      ).join("")}
                  </ul>
                </figcaption>
              </figure>

        state.routeCleanup.push(() => ctrl.destroy());
      }

      state.mentorsFilter.track = btn.dataset.mtrack || "all";

    if (row) {
      window.requestAnimationFrame(() => {
        const top = row.getBoundingClientRect().top + window.scrollY - 100;
        window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
      });
    }
  }
}

  const updatePlan = (activeId) => {

    const shapes = VENUE_PLAN.map((rp) => {

      const textCol = isSel ? rp.text : TOKENS.ivory;

          <text x="${rp.x + 1}" y="${rp.y + 2}" font-size="1" font-weight="600" fill="${textCol}">${esc(rp.label)}</text>

    svgEl.querySelectorAll("[data-room]").forEach((g) => {

      g.addEventListener("click", () => updatePlan(rid));
      g.addEventListener("keydown", (e) => {
        const ke = e;
        if (ke.key === "Enter" || ke.key === " ") {
          ke.preventDefault();

    listBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.room === activeId)));

function renderPass(main) {
  document.title = "Pass" + COPY.siteTitleSuffix;
  const totalLeft = PASS_TIERS.reduce((sum, t) => sum + t.left, 0);
  main.innerHTML = `
    <section class="sub-sec" data-surface="obsidian">
      <div class="grid-container">
        <p class="col-1-3 t-micro t-amber">Demo Seat Allocation</p>
        <div class="col-5-12">
          <h1 class="t-h1" tabindex="-1">Workshop Pass Simulator</h1>
          <p class="t-lead t-muted tnum" style="margin-top:16px;">${totalLeft} open student seats remaining out of ${WORKSHOP_META.capacity}. Fictional demo \u2014 no sign-up or payment.</p>
        </div>
        <div class="col-full" id="pass-capacity-wrap"></div>

        <div class="col-full" style="margin-top:40px;border-bottom:1px solid var(--rule-subtle);" id="pass-tiers">
          ${PASS_TIERS.map((t) => {
    const qty = state.passQty[t.id] || 0;
    return `
              <div class="tier-row" data-tier="${esc(t.id)}">
                <div>
                  <h2 class="t-lead">${esc(t.name)}</h2>
                  <p class="t-micro t-muted tnum" style="margin-top:4px;">${t.left} demo seats open</p>
                </div>
                <p class="t-small t-muted">${esc(t.includes)}</p>
                <p class="t-lead t-amber">${esc(t.priceLabel)}</p>
                <div class="stepper">
                  <button type="button" class="btn-stepper" data-step="-1" data-tid="${esc(t.id)}" aria-label="Decrease ${esc(t.name)}" ${qty <= 0 ? 'aria-disabled="true"' : ""}>\u2212</button>
                  <output class="t-lead tnum" style="min-width:28px;text-align:center;">${qty}</output>
                  <button type="button" class="btn-stepper" data-step="1" data-tid="${esc(t.id)}" aria-label="Increase ${esc(t.name)}" ${qty >= Math.min(2, t.left) ? 'aria-disabled="true"' : ""}>+</button>
                </div>
              </div>
            `;
  }).join("")}
        </div>

        <div class="col-full" style="margin-top:28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;">
          <div>
            <p class="t-micro t-muted">Selected Demo Seats</p>
            <p class="t-h2 t-amber tnum" id="pass-total-qty">0 seats (Free Demo)</p>
          </div>
          <button type="button" class="btn-primary" id="pass-confirm-btn" aria-disabled="true">Preview Demo Pass</button>
        </div>

        <div class="col-full" style="margin-top:64px;">
          <p class="t-micro t-amber" style="margin-bottom:12px;">Frequently Asked</p>
          <h2 class="t-h2">Questions</h2>
          <div style="margin-top:24px;border-bottom:1px solid var(--rule-subtle);">
            ${FAQ_ITEMS.map(
    (item) => `
                <details class="faq-item">
                  <summary class="faq-summary t-lead">
                    <span>${esc(item.q)}</span>
                    <span class="t-amber" aria-hidden="true">+</span>
                  </summary>
                  <p class="faq-answer t-body">${esc(item.a)}</p>
                </details>
              `
  ).join("")}
          </div>
        </div>
      </div>

      <dialog class="lab-dialog" id="pass-dialog" aria-labelledby="pass-dlg-title">
        <h2 class="t-h2" id="pass-dlg-title">Fictional Demo Preview</h2>
        <p class="t-body t-muted" id="pass-dlg-body" style="margin-top:16px;"></p>
        <div style="margin-top:24px;">
          <button type="button" class="btn-primary btn-sm" id="pass-dlg-close">Close</button>
        </div>
      </dialog>
    </section>
  `;
  const capCtrl = mountCapacityGrid(
    document.getElementById("pass-capacity-wrap"),
    { withSelection: true },
    showTip,
    hideTip
  );
  state.routeCleanup.push(() => capCtrl.destroy());
  const totalEl = document.getElementById("pass-total-qty");
  const confirmBtn = document.getElementById("pass-confirm-btn");
  const dialog = document.getElementById("pass-dialog");
  const dlgBody = document.getElementById("pass-dlg-body");
  const dlgClose = document.getElementById("pass-dlg-close");
  const refresh = () => {
    let sum = 0;
    PASS_TIERS.forEach((t) => {
      const q = state.passQty[t.id] || 0;
      sum += q;
      const row = main.querySelector(`.tier-row[data-tier="${t.id}"]`);
      if (row) {
        const out = row.querySelector("output");
        if (out) out.textContent = String(q);
        const dec = row.querySelector('[data-step="-1"]');
        const inc = row.querySelector('[data-step="1"]');
        dec?.setAttribute("aria-disabled", String(q <= 0));
        inc?.setAttribute("aria-disabled", String(q >= Math.min(2, t.left)));
      }
    });
    totalEl.textContent = `${sum} ${sum === 1 ? "seat" : "seats"} (Free Demo)`;
    capCtrl.setSelected(sum);
    confirmBtn.setAttribute("aria-disabled", String(sum === 0));
  };
  document.getElementById("pass-tiers")?.addEventListener("click", (e) => {
    const btn = e.target.closest(".btn-stepper");
    if (!btn || btn.getAttribute("aria-disabled") === "true") return;
    const tid = btn.dataset.tid || "";
    const delta = Number(btn.dataset.step);
    const tier = PASS_TIERS.find((t) => t.id === tid);
    if (!tier) return;
    const cur = state.passQty[tid] || 0;
    state.passQty[tid] = Math.max(0, Math.min(Math.min(2, tier.left), cur + delta));
    refresh();
  });
  confirmBtn.addEventListener("click", () => {
    if (confirmBtn.getAttribute("aria-disabled") === "true") return;
    const parts = PASS_TIERS.filter((t) => (state.passQty[t.id] || 0) > 0).map(
      (t) => `${state.passQty[t.id]} \xD7 ${t.name}`
    );
    dlgBody.textContent = `Tashkent Frame Lab is a fictional student workshop demo \u2014 no sign-up or booking was sent. Selected preview: ${parts.join(", ")}.`;
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", "");
    dlgClose.focus();
  });
  dlgClose.addEventListener("click", () => {
    if (typeof dialog.close === "function") dialog.close();
    else dialog.removeAttribute("open");
    confirmBtn.focus();
  });
  refresh();
}

function parseRoute(hash) {
  const clean = (hash || "#/").replace(/^#/, "");
  if (clean === "" || clean === "/") return { view: "home", key: "home" };
  const parts = clean.split("/").filter(Boolean);
  if (parts[0] === "program" && parts.length === 1) return { view: "program", key: "program" };
  if (parts[0] === "mentors" && parts.length === 1) return { view: "mentors", key: "mentors" };
  if (parts[0] === "mentors" && parts.length === 2) return { view: "mentor", param: parts[1], key: "mentor:" + parts[1] };
  if (parts[0] === "sessions" && parts.length === 1) return { view: "sessions", key: "sessions" };
  if (parts[0] === "sessions" && parts.length === 2) return { view: "sessions", param: parts[1], key: "sessions:" + parts[1] };
  if (parts[0] === "studio" && parts.length === 1) return { view: "studio", key: "studio" };
  if (parts[0] === "pass" && parts.length === 1) return { view: "pass", key: "pass" };
  return { view: "404", key: "404" };
}
function updateActiveNav(route) {
  const mapHref = {
    program: "#/program",
    mentors: "#/mentors",
    mentor: "#/mentors",
    sessions: "#/sessions",
    studio: "#/studio",
    pass: "#/pass"
  };
  const targetHref = mapHref[route.view] || "";
  document.querySelectorAll("#header-nav a, #menu-nav a").forEach((a) => {
    if (a.getAttribute("href") === targetHref) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}
var currentRouteKey = "";
function mountRoute(route, skipScrollFocus) {
  const main = document.getElementById("main");
  while (state.routeCleanup.length > 0) {
    const fn = state.routeCleanup.pop();
    try {
      fn?.();
    } catch {
    }
  }
  hideTip();
  if (route.view === "home") renderHome(main);
  else if (route.view === "program") renderProgramRoute(main);
  else if (route.view === "mentors") renderMentors(main);
  else if (route.view === "mentor" && route.param) renderMentorDetail(main, route.param);
  else if (route.view === "sessions") renderSessionsDirectory(main, route.param);
  else if (route.view === "studio") renderStudio(main);
  else if (route.view === "pass") renderPass(main);
  else renderNotFound(main);
  updateActiveNav(route);
  if (!(route.view === "sessions" && route.param)) {
    window.scrollTo(0, 0);
  }
  if (!skipScrollFocus) {
    const h1 = main.querySelector("h1");
    h1?.focus({ preventScroll: true });
  }
}
document.addEventListener("DOMContentLoaded", () => {
  initChrome();
  const initial = parseRoute(window.location.hash);
  currentRouteKey = initial.key;
  mountRoute(initial, true);
  window.addEventListener("hashchange", () => {
    const next = parseRoute(window.location.hash);
    if (next.key === currentRouteKey) return;
    currentRouteKey = next.key;
    mountRoute(next, false);
  });
});
